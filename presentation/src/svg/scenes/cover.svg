        <circle cx="510" cy="185" r="9"/>
        <circle cx="660" cy="185" r="9"/>
        <circle cx="510" cy="305" r="9"/>
        <circle cx="660" cy="305" r="9"/>
        <circle cx="810" cy="305" r="9"/>
        <circle cx="810" cy="405" r="7"/>
