<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8734A"/>
      <stop offset="100%" stop-color="#D4612F"/>
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BAD7A"/>
      <stop offset="100%" stop-color="#4A9968"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3D8B5E"/>
      <stop offset="100%" stop-color="#5BAD7A"/>
    </linearGradient>
    <clipPath id="mainWindowClip">
      <rect x="400" y="55" width="720" height="450" rx="12"/>
    </clipPath>
    <clipPath id="codeWindowClip">
      <rect x="870" y="150" width="280" height="340" rx="10"/>
    </clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#2B2B3D"/>

